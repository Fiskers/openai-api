name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENAI_TEST_API_KEY: ${{ secrets.OPENAI_TEST_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate package contents
        run: npm pack --dry-run
      - name: Run live API tests
        if: env.OPENAI_TEST_API_KEY != ''
        run: npm test
      - name: Explain skipped live tests
        if: env.OPENAI_TEST_API_KEY == ''
        run: echo "Live API tests skipped because OPENAI_TEST_API_KEY is not configured."
